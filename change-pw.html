<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 변경 - 우양재단 휴가관리 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-page">
  <main class="card auth-card">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="우양재단 로고" onerror="this.style.display='none'">
      <h1 class="brand-title">우양재단</h1>
      <p class="brand-subtitle">휴가관리 시스템</p>
    </div>

    <h2 class="page-title">비밀번호 변경</h2>
    <p class="page-description">최초 로그인입니다. 사용하실 비밀번호로 변경해주세요.</p>

    <form id="changePwForm">
      <div class="form-group">
        <label for="currentPassword">현재 비밀번호</label>
        <input id="currentPassword" type="text" value="wooyang2026" readonly>
      </div>

      <div class="form-group">
        <label for="newPassword">새 비밀번호</label>
        <input id="newPassword" type="password" autocomplete="new-password" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">새 비밀번호 확인</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" required>
      </div>

      <button class="btn btn-primary btn-full" id="changeButton" type="submit">비밀번호 변경</button>
    </form>
  </main>

  <script src="assets/app.js"></script>
  <script>
    const user = getUser();
    if (!user) {
      location.href = 'index.html';
    }

    const form = document.getElementById('changePwForm');
    const button = document.getElementById('changeButton');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 6) {
        toast('새 비밀번호는 6자 이상이어야 합니다.', 'warning');
        return;
      }

      if (newPassword === 'wooyang2026') {
        toast('초기 비밀번호와 다른 비밀번호를 사용해주세요.', 'warning');
        return;
      }

      if (newPassword !== confirmPassword) {
        toast('새 비밀번호 확인이 일치하지 않습니다.', 'warning');
        return;
      }

      button.disabled = true;
      button.textContent = '변경 중...';

      try {
        const data = await callAPI('changePassword', {
          empId: getEmpId(user),
          newPassword
        });

        if (!normalizeSuccess(data)) {
          toast(getErrorMessage(data, '비밀번호 변경에 실패했습니다.'), 'error');
          return;
        }

        // 최초 로그인 플래그를 세션에서 제거해 대시보드로 자연스럽게 이동합니다.
        setUser({ ...user, mustChangePw: false });
        toast('비밀번호가 변경되었습니다.', 'success');
        setTimeout(() => {
          location.href = 'dashboard.html';
        }, 800);
      } catch (error) {
        toast(error.message || '비밀번호 변경 중 오류가 발생했습니다.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = '비밀번호 변경';
      }
    });
  </script>
</body>
</html>
