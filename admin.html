<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 메인 - 우양재단 휴가관리 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="app-header">
    <a class="header-title" href="admin.html">우양재단 휴가관리 (관리자)</a>
    <div class="header-right">
      <span class="user-summary" id="userSummary">로딩 중...</span>
      <a class="btn btn-secondary" href="dashboard.html">대시보드</a>
      <button class="btn btn-secondary" type="button" onclick="logout()">로그아웃</button>
    </div>
  </header>

  <main class="container">
    <nav class="admin-tabs" aria-label="관리자 메뉴">
      <a class="admin-tab active" href="admin.html">결재 대기</a>
      <a class="admin-tab" href="admin-history.html">전체 이력</a>
      <a class="admin-tab" href="admin-employees.html">직원 현황</a>
    </nav>

    <section class="section-header">
      <div>
        <h1 class="page-title">결재 대기</h1>
        <p class="page-description">승인 또는 반려가 필요한 휴가 신청 목록입니다.</p>
      </div>
    </section>

    <section class="pending-grid" id="pendingGrid">
      <article class="card empty-state">결재 대기 목록을 불러오는 중입니다.</article>
    </section>
  </main>

  <div class="modal-overlay" id="rejectModal" aria-hidden="true">
    <div class="card modal-card" role="dialog" aria-modal="true" aria-labelledby="rejectTitle">
      <h2 class="modal-title" id="rejectTitle">반려 사유를 입력해주세요</h2>
      <div class="form-group">
        <label for="rejectReason">반려 사유</label>
        <textarea id="rejectReason" maxlength="200" placeholder="반려 사유를 입력해주세요."></textarea>
        <div class="char-counter"><span id="rejectReasonCount">0</span>/200</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" type="button" id="rejectCancel">취소</button>
        <button class="btn btn-danger" type="button" id="rejectConfirm">반려 확정</button>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    const user = requireLogin();
    let selectedRejectRow = null;

    function isAdmin(currentUser) {
      return currentUser && (currentUser.권한 || currentUser.role || currentUser.authority) === '관리자';
    }

    function denyAccess() {
      toast('관리자만 접근 가능합니다', 'warning');
      setTimeout(() => {
        location.href = 'dashboard.html';
      }, 700);
    }

    function isAPISuccess(data) {
      return Array.isArray(data) || !data || (data.success !== false && data.ok !== false);
    }

    function getList(data) {
      if (Array.isArray(data)) return data;
      return data.pending || data.requests || data.leaves || data.data || [];
    }

    function getField(item, keys, fallback = '-') {
      for (const key of keys) {
        if (item[key] !== undefined && item[key] !== null && item[key] !== '') return item[key];
      }
      return fallback;
    }

    function getRowValue(item) {
      return getField(item, ['row', 'rowNumber', 'rowIndex', '행번호', '신청번호', 'requestId', 'id'], '');
    }

    function renderHeader() {
      const name = getDisplayName(user);
      const department = getDepartment(user);
      const position = getPosition(user);
      document.getElementById('userSummary').textContent = `${name}님 (${department}/${position})`;
    }

    function renderPending(items) {
      const grid = document.getElementById('pendingGrid');

      if (items.length === 0) {
        grid.innerHTML = '<article class="card empty-state">결재 대기 중인 신청이 없습니다 ☕</article>';
        return;
      }

      grid.innerHTML = items.map((item, index) => {
        const row = getRowValue(item);
        const applicant = getField(item, ['신청자이름', 'name', 'applicantName', '신청자']);
        const department = getField(item, ['부서', 'department', 'dept']);
        const type = getField(item, ['휴가종류', 'type', 'leaveType']);
        const paid = getField(item, ['유급구분', 'paid'], '유급');
        const startDate = getField(item, ['시작일', 'startDate'], '');
        const endDate = getField(item, ['종료일', 'endDate'], '');
        const period = startDate && endDate ? `${startDate} ~ ${endDate}` : getField(item, ['기간', 'period']);
        const days = getField(item, ['사용일수', 'days', 'usedDays'], '0');
        const reason = getField(item, ['사유', 'reason'], '-');
        const createdAt = getField(item, ['신청일시', 'createdAt', 'appliedAt', 'requestedAt']);
        const paidClass = paid === '무급' ? 'badge-unpaid' : 'badge-paid';

        return `
          <article class="card pending-card">
            <div class="pending-head">
              <div>
                <h2 class="pending-name">${escapeHTML(applicant)}</h2>
                <div class="pending-meta">${escapeHTML(department)}</div>
              </div>
              <span class="badge ${paidClass}">${escapeHTML(paid)}</span>
            </div>
            <div class="detail-list">
              <div class="detail-row"><strong>휴가종류</strong><span>${escapeHTML(type)}</span></div>
              <div class="detail-row"><strong>기간</strong><span>${escapeHTML(period)}</span></div>
              <div class="detail-row"><strong>사용일수</strong><span>${escapeHTML(days)}일</span></div>
              <div class="detail-row"><strong>사유</strong><span>${escapeHTML(reason)}</span></div>
              <div class="detail-row"><strong>신청일시</strong><span>${escapeHTML(createdAt)}</span></div>
            </div>
            <div class="pending-actions">
              <button class="btn btn-secondary" type="button" data-action="reject" data-index="${index}">반려</button>
              <button class="btn btn-primary" type="button" data-action="approve" data-index="${index}">승인</button>
            </div>
            <input type="hidden" value="${escapeHTML(row)}">
          </article>
        `;
      }).join('');

      grid.querySelectorAll('button[data-action]').forEach((button) => {
        button.addEventListener('click', () => {
          const item = items[Number(button.dataset.index)];
          if (button.dataset.action === 'approve') approveLeave(item);
          if (button.dataset.action === 'reject') openRejectModal(item);
        });
      });
    }

    async function loadPending() {
      try {
        const data = await callAPI('getPendingList', { empId: getEmpId(user) });

        if (!isAPISuccess(data)) {
          toast(getErrorMessage(data, '결재 대기 목록을 불러오지 못했습니다.'), 'error');
          renderPending([]);
          return;
        }

        renderPending(getList(data));
      } catch (error) {
        toast(error.message || '결재 대기 목록 로딩 중 오류가 발생했습니다.', 'error');
        renderPending([]);
      }
    }

    async function approveLeave(item) {
      if (!confirm('승인하시겠습니까?')) return;

      try {
        const data = await callAPI('approve', {
          empId: getEmpId(user),
          row: getRowValue(item)
        });

        if (!isAPISuccess(data)) {
          toast(getErrorMessage(data, '승인 처리에 실패했습니다.'), 'error');
          return;
        }

        toast('승인 처리되었습니다.', 'success');
        loadPending();
      } catch (error) {
        toast(error.message || '승인 처리 중 오류가 발생했습니다.', 'error');
      }
    }

    function openRejectModal(item) {
      selectedRejectRow = getRowValue(item);
      document.getElementById('rejectReason').value = '';
      document.getElementById('rejectReasonCount').textContent = '0';
      document.getElementById('rejectModal').classList.add('show');
      document.getElementById('rejectModal').setAttribute('aria-hidden', 'false');
      document.getElementById('rejectReason').focus();
    }

    function closeRejectModal() {
      selectedRejectRow = null;
      document.getElementById('rejectModal').classList.remove('show');
      document.getElementById('rejectModal').setAttribute('aria-hidden', 'true');
    }

    async function rejectLeave() {
      const reason = document.getElementById('rejectReason').value.trim();

      if (!reason) {
        toast('반려 사유를 입력해주세요.', 'warning');
        return;
      }

      try {
        const data = await callAPI('reject', {
          empId: getEmpId(user),
          row: selectedRejectRow,
          reason
        });

        if (!isAPISuccess(data)) {
          toast(getErrorMessage(data, '반려 처리에 실패했습니다.'), 'error');
          return;
        }

        toast('반려 처리되었습니다.', 'success');
        closeRejectModal();
        loadPending();
      } catch (error) {
        toast(error.message || '반려 처리 중 오류가 발생했습니다.', 'error');
      }
    }

    document.getElementById('rejectReason').addEventListener('input', (event) => {
      document.getElementById('rejectReasonCount').textContent = String(event.target.value.length);
    });

    document.getElementById('rejectCancel').addEventListener('click', closeRejectModal);
    document.getElementById('rejectConfirm').addEventListener('click', rejectLeave);
    document.getElementById('rejectModal').addEventListener('click', (event) => {
      if (event.target.id === 'rejectModal') closeRejectModal();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeRejectModal();
    });

    if (user && isAdmin(user)) {
      renderHeader();
      loadPending();
    } else if (user) {
      denyAccess();
    }
  </script>
</body>
</html>
