<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우양재단 휴가관리 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-page">
  <main class="card auth-card">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="우양재단 로고" onerror="this.style.display='none'">
      <h1 class="brand-title">우양재단</h1>
      <p class="brand-subtitle">휴가관리 시스템</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="empId">사번</label>
        <input id="empId" name="empId" type="text" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="btn btn-primary btn-full" id="loginButton" type="submit">로그인</button>
    </form>

    <p class="helper-text">초기 비밀번호는 wooyang2026 입니다</p>
  </main>

  <script src="assets/app.js"></script>
  <script>
    const savedUser = getUser();
    if (savedUser) {
      location.href = 'dashboard.html';
    }

    const form = document.getElementById('loginForm');
    const button = document.getElementById('loginButton');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const empId = document.getElementById('empId').value.trim();
      const password = document.getElementById('password').value;

      if (!empId || !password) {
        toast('사번과 비밀번호를 입력해주세요.', 'warning');
        return;
      }

      button.disabled = true;
      button.textContent = '로그인 중...';

      try {
        const data = await callAPI('login', { empId, password });

        if (!normalizeSuccess(data)) {
          toast(getErrorMessage(data, '로그인에 실패했습니다.'), 'error');
          return;
        }

        // API가 user 객체를 감싸거나 최상위에 사용자 정보를 줄 수 있어 모두 대응합니다.
        const user = data.user || data.data || data;
        setUser({ ...user, empId: user.empId || empId });

        if (data.mustChangePw || user.mustChangePw) {
          location.href = 'change-pw.html';
        } else {
          location.href = 'dashboard.html';
        }
      } catch (error) {
        toast(error.message || '로그인 처리 중 오류가 발생했습니다.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = '로그인';
      }
    });
  </script>
</body>
</html>
