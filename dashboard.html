<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드 - 우양재단 휴가관리 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="app-header">
    <a class="header-title" href="dashboard.html">우양재단 휴가관리</a>
    <div class="header-right">
      <span class="user-summary" id="userSummary">로딩 중...</span>
      <a class="btn btn-primary" id="adminButton" href="admin.html" style="display: none;">관리자 페이지</a>
      <button class="btn btn-secondary" type="button" onclick="logout()">로그아웃</button>
    </div>
  </header>

  <main class="container">
    <section class="greeting">
      <h1 id="greetingText">안녕하세요.</h1>
      <p>내 연차 현황과 최근 신청 내역을 확인할 수 있습니다.</p>
    </section>

    <section class="stats-grid" aria-label="연차 현황">
      <article class="card stat-card">
        <div class="stat-label">총 연차</div>
        <div class="stat-value"><span id="totalDays">-</span><span class="stat-unit">일</span></div>
      </article>
      <article class="card stat-card stat-used">
        <div class="stat-label">사용</div>
        <div class="stat-value"><span id="usedDays">-</span><span class="stat-unit">일</span></div>
      </article>
      <article class="card stat-card stat-remain">
        <div class="stat-label">잔여</div>
        <div class="stat-value"><span id="remainDays">-</span><span class="stat-unit">일</span></div>
      </article>
    </section>

    <section class="action-row">
      <a class="btn btn-primary" href="apply.html">휴가 신청하기</a>
      <button class="btn btn-secondary" type="button" id="calendarButton">캘린더 보기</button>
    </section>

    <section class="card">
      <h2 class="section-title">최근 신청 내역</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>신청번호</th>
              <th>휴가종류</th>
              <th>기간</th>
              <th>일수</th>
              <th>상태</th>
              <th>신청일시</th>
            </tr>
          </thead>
          <tbody id="requestRows">
            <tr>
              <td class="empty-state" colspan="6">신청 내역을 불러오는 중입니다.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="assets/app.js"></script>
  <script>
    const user = requireLogin();

    document.getElementById('calendarButton').addEventListener('click', () => {
      toast('준비 중입니다', 'info');
    });

    function getGreetingLabel() {
      const hour = new Date().getHours();
      if (hour < 12) return '좋은 오전입니다';
      if (hour < 18) return '좋은 오후입니다';
      return '편안한 저녁입니다';
    }

    function formatDays(value) {
      const number = Number(value || 0);
      return Number.isInteger(number) ? String(number) : number.toFixed(1);
    }

    function getStatusBadge(status) {
      const normalized = status || '대기';
      let className = 'badge-waiting';

      if (normalized === '승인') className = 'badge-approved';
      if (normalized === '반려') className = 'badge-rejected';

      return `<span class="badge ${className}">${escapeHTML(normalized)}</span>`;
    }

    function updateHeader(info) {
      const merged = { ...user, ...info };
      const name = getDisplayName(merged);
      const department = getDepartment(merged);
      const position = getPosition(merged);
      const role = merged.권한 || merged.role || merged.authority;

      document.getElementById('userSummary').textContent = `${name}님 (${department}/${position})`;
      document.getElementById('greetingText').textContent = `${name}님, ${getGreetingLabel()} 👋`;
      document.getElementById('adminButton').style.display = role === '관리자' ? 'inline-flex' : 'none';
    }

    function renderStats(info) {
      // API 필드명이 달라도 Phase 1 화면이 깨지지 않도록 대표 후보를 순서대로 읽습니다.
      const total = info.totalAnnualLeave ?? info.totalDays ?? info.total ?? 0;
      const used = info.usedAnnualLeave ?? info.usedDays ?? info.used ?? 0;
      const remain = info.remainingAnnualLeave ?? info.remainDays ?? info.remaining ?? (Number(total) - Number(used));

      document.getElementById('totalDays').textContent = formatDays(total);
      document.getElementById('usedDays').textContent = formatDays(used);
      document.getElementById('remainDays').textContent = formatDays(remain);
    }

    function renderRequests(requests) {
      const tbody = document.getElementById('requestRows');
      const rows = (requests || []).slice(0, 10);

      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td class="empty-state" colspan="6">신청 내역이 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map((item) => {
        const requestId = item.requestId || item.id || item.no || '-';
        const type = item.type || item.leaveType || '-';
        const startDate = item.startDate || '';
        const endDate = item.endDate || '';
        const period = startDate && endDate ? `${startDate} ~ ${endDate}` : '-';
        const days = formatDays(item.days || item.usedDays || 0);
        const status = item.status || '대기';
        const createdAt = item.createdAt || item.appliedAt || item.requestedAt || '-';

        return `
          <tr>
            <td>${escapeHTML(requestId)}</td>
            <td>${escapeHTML(type)}</td>
            <td>${escapeHTML(period)}</td>
            <td>${days}일</td>
            <td>${getStatusBadge(status)}</td>
            <td>${escapeHTML(createdAt)}</td>
          </tr>
        `;
      }).join('');
    }

    async function loadDashboard() {
      try {
        const data = await callAPI('getMyInfo', { empId: getEmpId(user) });

        if (!normalizeSuccess(data)) {
          toast(getErrorMessage(data, '내 정보를 불러오지 못했습니다.'), 'error');
          return;
        }

        const info = data.user || data.data || data.info || data;
        const requests = data.requests || data.applications || info.requests || [];

        setUser({ ...user, ...info });
        updateHeader(info);
        renderStats(info);
        renderRequests(requests);
      } catch (error) {
        updateHeader(user);
        renderStats({});
        renderRequests([]);
        toast(error.message || '대시보드 로딩 중 오류가 발생했습니다.', 'error');
      }
    }

    if (user) {
      updateHeader(user);
      loadDashboard();
    }
  </script>
</body>
</html>
