<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴가 신청 - 우양재단 휴가관리 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="app-header">
    <a class="header-title" href="dashboard.html">← 대시보드로 돌아가기</a>
    <div class="header-right">
      <span class="user-summary" id="userSummary">로딩 중...</span>
      <button class="btn btn-secondary" type="button" onclick="logout()">로그아웃</button>
    </div>
  </header>

  <main class="container">
    <section class="card form-card">
      <h1 class="page-title">휴가 신청</h1>
      <p class="page-description">휴가 정보를 입력한 뒤 신청 버튼을 눌러주세요.</p>

      <form id="applyForm">
        <div class="form-row">
          <div class="form-group">
            <label for="applicant">신청자</label>
            <input id="applicant" type="text" readonly>
          </div>
          <div class="form-group">
            <label for="department">부서</label>
            <input id="department" type="text" readonly>
          </div>
        </div>

        <div class="form-group">
          <label for="approver">결재자</label>
          <input id="approver" type="text" readonly>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="leaveType">휴가종류</label>
            <select id="leaveType" required>
              <option value="">선택해주세요</option>
              <option value="연차">연차</option>
              <option value="오전반차">오전반차</option>
              <option value="오후반차">오후반차</option>
              <option value="병가">병가</option>
              <option value="경조사">경조사</option>
              <option value="공가">공가</option>
              <option value="기타">기타</option>
            </select>
          </div>

          <div class="form-group">
            <label>유급구분</label>
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="paid" value="유급" checked>
                유급
              </label>
              <label class="radio-option">
                <input type="radio" name="paid" value="무급">
                무급
              </label>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="startDate">시작일</label>
            <input id="startDate" type="date" required>
          </div>
          <div class="form-group">
            <label for="endDate">종료일</label>
            <input id="endDate" type="date" required>
          </div>
        </div>

        <div class="form-group">
          <label for="days">사용일수</label>
          <input id="days" type="text" value="0" readonly>
        </div>

        <div class="form-group">
          <label for="reason">사유</label>
          <textarea id="reason" maxlength="200" placeholder="사유를 입력해주세요." required></textarea>
          <div class="char-counter"><span id="reasonCount">0</span>/200</div>
        </div>

        <div class="form-actions">
          <button class="btn btn-secondary" type="button" id="cancelButton">취소</button>
          <button class="btn btn-primary" type="submit" id="submitButton">신청</button>
        </div>
      </form>
    </section>
  </main>

  <script src="assets/app.js"></script>
  <script>
    const user = requireLogin();
    let myInfo = user || {};

    const applicantInput = document.getElementById('applicant');
    const departmentInput = document.getElementById('department');
    const approverInput = document.getElementById('approver');
    const leaveTypeInput = document.getElementById('leaveType');
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const daysInput = document.getElementById('days');
    const reasonInput = document.getElementById('reason');
    const reasonCount = document.getElementById('reasonCount');
    const submitButton = document.getElementById('submitButton');

    function isHalfDay(type) {
      return type === '오전반차' || type === '오후반차';
    }

    function parseDate(value) {
      if (!value) return null;
      const [year, month, day] = value.split('-').map(Number);
      return new Date(year, month - 1, day);
    }

    function calculateBusinessDays(startValue, endValue) {
      const start = parseDate(startValue);
      const end = parseDate(endValue);

      if (!start || !end || end < start) return 0;

      let current = new Date(start);
      let count = 0;

      // 시작일부터 종료일까지 순회하며 토요일(6), 일요일(0)을 제외합니다.
      while (current <= end) {
        const day = current.getDay();
        if (day !== 0 && day !== 6) {
          count += 1;
        }
        current.setDate(current.getDate() + 1);
      }

      return count;
    }

    function updateDays() {
      const type = leaveTypeInput.value;

      if (isHalfDay(type)) {
        if (startDateInput.value) {
          endDateInput.value = startDateInput.value;
        }
        endDateInput.readOnly = true;
        daysInput.value = startDateInput.value ? '0.5' : '0';
        return;
      }

      endDateInput.readOnly = false;
      daysInput.value = String(calculateBusinessDays(startDateInput.value, endDateInput.value));
    }

    function renderUserInfo(info) {
      const name = getDisplayName(info);
      const department = getDepartment(info);
      const position = getPosition(info);
      const approver = info.approver || info.approverName || info.manager || info.결재자 || '-';

      document.getElementById('userSummary').textContent = `${name}님 (${department}/${position})`;
      applicantInput.value = name;
      departmentInput.value = department;
      approverInput.value = approver;
    }

    async function loadMyInfo() {
      try {
        const data = await callAPI('getMyInfo', { empId: getEmpId(user) });

        if (!normalizeSuccess(data)) {
          toast(getErrorMessage(data, '내 정보를 불러오지 못했습니다.'), 'error');
          renderUserInfo(myInfo);
          return;
        }

        myInfo = data.user || data.data || data.info || data;
        setUser({ ...user, ...myInfo });
        renderUserInfo(myInfo);
      } catch (error) {
        renderUserInfo(myInfo);
        toast(error.message || '내 정보 로딩 중 오류가 발생했습니다.', 'error');
      }
    }

    leaveTypeInput.addEventListener('change', updateDays);
    startDateInput.addEventListener('change', updateDays);
    endDateInput.addEventListener('change', updateDays);

    reasonInput.addEventListener('input', () => {
      reasonCount.textContent = String(reasonInput.value.length);
    });

    document.getElementById('cancelButton').addEventListener('click', () => {
      location.href = 'dashboard.html';
    });

    document.getElementById('applyForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const type = leaveTypeInput.value;
      const paid = document.querySelector('input[name="paid"]:checked').value;
      const startDate = startDateInput.value;
      const endDate = endDateInput.value;
      const days = Number(daysInput.value);
      const reason = reasonInput.value.trim();

      if (!type || !paid || !startDate || !endDate || !reason) {
        toast('필수 항목을 모두 입력해주세요.', 'warning');
        return;
      }

      if (endDate < startDate) {
        toast('종료일은 시작일보다 빠를 수 없습니다.', 'warning');
        return;
      }

      if (days <= 0) {
        toast('사용일수를 확인해주세요.', 'warning');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = '신청 중...';

      try {
        const data = await callAPI('applyLeave', {
          empId: getEmpId(user),
          type,
          paid,
          startDate,
          endDate,
          days,
          reason
        });

        if (!normalizeSuccess(data)) {
          toast(getErrorMessage(data, '휴가 신청에 실패했습니다.'), 'error');
          return;
        }

        toast('휴가 신청이 접수되었습니다 ✓', 'success');
        setTimeout(() => {
          location.href = 'dashboard.html';
        }, 1000);
      } catch (error) {
        toast(error.message || '휴가 신청 중 오류가 발생했습니다.', 'error');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = '신청';
      }
    });

    if (user) {
      renderUserInfo(myInfo);
      loadMyInfo();
    }
  </script>
</body>
</html>
