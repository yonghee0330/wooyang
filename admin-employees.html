<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>직원 연차 현황 - 우양재단 휴가관리 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="app-header">
    <a class="header-title" href="admin.html">우양재단 휴가관리 (관리자)</a>
    <div class="header-right">
      <span class="user-summary" id="userSummary">로딩 중...</span>
      <a class="btn btn-secondary" href="dashboard.html">대시보드</a>
      <button class="btn btn-secondary" type="button" onclick="logout()">로그아웃</button>
    </div>
  </header>

  <main class="container">
    <nav class="admin-tabs" aria-label="관리자 메뉴">
      <a class="admin-tab" href="admin.html">결재 대기</a>
      <a class="admin-tab" href="admin-history.html">전체 이력</a>
      <a class="admin-tab active" href="admin-employees.html">직원 현황</a>
    </nav>

    <section class="section-header">
      <div>
        <h1 class="page-title">직원 연차 현황</h1>
        <p class="page-description">직원별 총 연차, 사용 연차, 잔여 연차를 확인합니다.</p>
      </div>
    </section>

    <section class="stats-grid" aria-label="직원 연차 요약">
      <article class="card stat-card">
        <div class="stat-label">전체 직원 수</div>
        <div class="stat-value"><span id="employeeCount">-</span><span class="stat-unit">명</span></div>
      </article>
      <article class="card stat-card stat-used">
        <div class="stat-label">평균 사용 연차</div>
        <div class="stat-value"><span id="avgUsed">-</span><span class="stat-unit">일</span></div>
      </article>
      <article class="card stat-card stat-remain">
        <div class="stat-label">평균 잔여 연차</div>
        <div class="stat-value"><span id="avgRemain">-</span><span class="stat-unit">일</span></div>
      </article>
    </section>

    <section class="card filter-card">
      <div class="filter-grid">
        <div class="form-group">
          <label for="departmentFilter">부서</label>
          <select id="departmentFilter">
            <option value="전체">전체</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="table-wrap wide-table">
        <table>
          <thead>
            <tr>
              <th>사번</th>
              <th>이름</th>
              <th>부서</th>
              <th>직급</th>
              <th>입사일</th>
              <th>총일수</th>
              <th>사용</th>
              <th>잔여</th>
              <th>잔여비율</th>
              <th>권한</th>
            </tr>
          </thead>
          <tbody id="employeeRows">
            <tr>
              <td class="empty-state" colspan="10">직원 현황을 불러오는 중입니다.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="assets/app.js"></script>
  <script>
    const user = requireLogin();
    let allEmployees = [];
    let filteredEmployees = [];

    function isAdmin(currentUser) {
      return currentUser && (currentUser.권한 || currentUser.role || currentUser.authority) === '관리자';
    }

    function denyAccess() {
      toast('관리자만 접근 가능합니다', 'warning');
      setTimeout(() => {
        location.href = 'dashboard.html';
      }, 700);
    }

    function isAPISuccess(data) {
      return Array.isArray(data) || !data || (data.success !== false && data.ok !== false);
    }

    function getList(data) {
      if (Array.isArray(data)) return data;
      return data.employees || data.users || data.data || [];
    }

    function getField(item, keys, fallback = '') {
      for (const key of keys) {
        if (item[key] !== undefined && item[key] !== null && item[key] !== '') return item[key];
      }
      return fallback;
    }

    function toNumber(value) {
      const number = Number(value || 0);
      return Number.isFinite(number) ? number : 0;
    }

    function formatOneDecimal(value) {
      return toNumber(value).toFixed(1);
    }

    function normalizeEmployee(item) {
      const total = toNumber(getField(item, ['총일수', 'totalAnnualLeave', 'totalDays', 'total']));
      const used = toNumber(getField(item, ['사용', 'usedAnnualLeave', 'usedDays', 'used']));
      const remain = getField(item, ['잔여', 'remainingAnnualLeave', 'remainDays', 'remaining'], null);

      return {
        사번: getField(item, ['사번', 'empId', 'employeeId', 'id']),
        이름: getField(item, ['이름', 'name', 'userName']),
        부서: getField(item, ['부서', 'department', 'dept']),
        직급: getField(item, ['직급', 'position', 'rank', 'title']),
        입사일: getField(item, ['입사일', 'joinDate', 'hireDate']),
        총일수: total,
        사용: used,
        잔여: remain === null ? total - used : toNumber(remain),
        권한: getField(item, ['권한', 'role', 'authority'], '사용자')
      };
    }

    function renderHeader() {
      const name = getDisplayName(user);
      const department = getDepartment(user);
      const position = getPosition(user);
      document.getElementById('userSummary').textContent = `${name}님 (${department}/${position})`;
    }

    function renderDepartmentFilter() {
      const select = document.getElementById('departmentFilter');
      const departments = [...new Set(allEmployees.map((item) => item.부서).filter(Boolean))].sort();
      select.innerHTML = '<option value="전체">전체</option>' + departments
        .map((department) => `<option value="${escapeHTML(department)}">${escapeHTML(department)}</option>`)
        .join('');
    }

    function applyFilter() {
      const department = document.getElementById('departmentFilter').value;
      filteredEmployees = allEmployees.filter((item) => department === '전체' || item.부서 === department);
      renderSummary();
      renderRows();
    }

    function renderSummary() {
      const count = filteredEmployees.length;
      const usedSum = filteredEmployees.reduce((sum, item) => sum + item.사용, 0);
      const remainSum = filteredEmployees.reduce((sum, item) => sum + item.잔여, 0);

      document.getElementById('employeeCount').textContent = String(count);
      document.getElementById('avgUsed').textContent = count ? formatOneDecimal(usedSum / count) : '0.0';
      document.getElementById('avgRemain').textContent = count ? formatOneDecimal(remainSum / count) : '0.0';
    }

    function getProgressClass(ratio) {
      if (ratio >= 80) return '';
      if (ratio >= 50) return 'yellow';
      return 'red';
    }

    function renderProgress(remain, total) {
      const ratio = total > 0 ? Math.max(0, Math.min(100, (remain / total) * 100)) : 0;
      const className = getProgressClass(ratio);

      return `
        <div class="progress-cell">
          <div class="progress-track">
            <div class="progress-fill ${className}" style="width: ${ratio.toFixed(1)}%"></div>
          </div>
          <span class="progress-label">${ratio.toFixed(1)}%</span>
        </div>
      `;
    }

    function renderRows() {
      const tbody = document.getElementById('employeeRows');

      if (filteredEmployees.length === 0) {
        tbody.innerHTML = '<tr><td class="empty-state" colspan="10">조건에 맞는 직원이 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = filteredEmployees.map((item) => `
        <tr>
          <td>${escapeHTML(item.사번 || '-')}</td>
          <td>${escapeHTML(item.이름 || '-')}</td>
          <td>${escapeHTML(item.부서 || '-')}</td>
          <td>${escapeHTML(item.직급 || '-')}</td>
          <td>${escapeHTML(item.입사일 || '-')}</td>
          <td>${escapeHTML(formatOneDecimal(item.총일수))}</td>
          <td>${escapeHTML(formatOneDecimal(item.사용))}</td>
          <td>${escapeHTML(formatOneDecimal(item.잔여))}</td>
          <td>${renderProgress(item.잔여, item.총일수)}</td>
          <td>${escapeHTML(item.권한 || '-')}</td>
        </tr>
      `).join('');
    }

    async function loadEmployees() {
      try {
        const data = await callAPI('getAllEmployees', { empId: getEmpId(user) });

        if (!isAPISuccess(data)) {
          toast(getErrorMessage(data, '직원 현황을 불러오지 못했습니다.'), 'error');
          allEmployees = [];
        } else {
          allEmployees = getList(data).map(normalizeEmployee);
        }

        renderDepartmentFilter();
        applyFilter();
      } catch (error) {
        allEmployees = [];
        renderDepartmentFilter();
        applyFilter();
        toast(error.message || '직원 현황 로딩 중 오류가 발생했습니다.', 'error');
      }
    }

    document.getElementById('departmentFilter').addEventListener('change', applyFilter);

    if (user && isAdmin(user)) {
      renderHeader();
      loadEmployees();
    } else if (user) {
      denyAccess();
    }
  </script>
</body>
</html>
